<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>消耗性用品申請系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#21261F;
    --paper:#EDEFE9;
    --surface:#FFFFFF;
    --line:#CBCFC3;
    --line-soft:#DDE0D5;
    --muted:#6B7063;
    --accent:#B8862B;
    --accent-dark:#8C6620;
    --accent-soft:#F1E4C6;
    --teal:#3E6B5C;
    --teal-soft:#DEE9E4;
    --rust:#9C4A32;
    --rust-soft:#F1DDD5;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;}

  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:216px;flex-shrink:0;background:var(--ink);color:#EDEFE9;display:flex;flex-direction:column;}
  .brand{padding:22px 20px 16px;font-size:18px;font-weight:700;letter-spacing:0.2px;border-bottom:1px solid rgba(255,255,255,0.12);line-height:1.4;}
  .brand small{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:12px;color:#B7BDAC;margin-top:4px;}
  nav{flex:1;padding:14px 0;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:14px;cursor:pointer;color:#D6D9CC;border-left:3px solid transparent;}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:#5B6152;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
  .nav-item.active{color:#fff;background:rgba(255,255,255,0.08);border-left-color:var(--accent);}
  .nav-item.active .dot{background:var(--accent);}
  .sidebar-foot{padding:14px 20px;font-size:11px;color:#8B917E;border-top:1px solid rgba(255,255,255,0.12);}

  /* Main */
  main{flex:1;min-width:0;padding:32px 40px 60px;}
  .page-head{margin-bottom:24px;}
  .page-head h1{font-size:22px;margin:0 0 6px;}
  .page-head p{margin:0;color:var(--muted);font-size:13.5px;max-width:640px;line-height:1.6;}

  .panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
  .panel + .panel{margin-top:0;}
  .panel h2{font-size:15px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);}
  .panel h3{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600;}

  label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;}
  input[type=text],input[type=number],input[type=email],input[type=date],textarea,select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{margin-bottom:16px;}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius);border:1px solid var(--ink);
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;}
  .btn:hover{background:#343B2C;}
  .btn.primary{background:var(--accent-dark);border-color:var(--accent-dark);}
  .btn.primary:hover{background:#74531A;}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn.ghost:hover{background:var(--paper);}
  .btn.small{padding:5px 11px;font-size:12.5px;}
  .btn.danger-o{background:transparent;border-color:var(--rust);color:var(--rust);}
  .btn.teal-o{background:transparent;border-color:var(--teal);color:var(--teal);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:0 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAF6;}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.pending{background:var(--accent-soft);color:var(--accent-dark);}
  .badge.approved{background:var(--teal-soft);color:var(--teal);}
  .badge.rejected{background:var(--rust-soft);color:var(--rust);}
  .badge.low{background:var(--rust-soft);color:var(--rust);}
  .badge.ok{background:var(--teal-soft);color:var(--teal);}

  .empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13.5px;}
  .toast{position:fixed;bottom:28px;right:28px;background:var(--ink);color:#fff;padding:16px 24px;border-radius:8px;
    font-size:16px;font-weight:500;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,0.25);z-index:50;max-width:420px;min-width:220px;}
  .toast.err{background:var(--rust);}
  .toast.ok{background:var(--teal);}

  @media (max-width: 860px){
    .toast{left:16px;right:16px;bottom:16px;max-width:none;font-size:15px;padding:14px 18px;}
  }

  .toolbar-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .toolbar-row input[type=text]{flex:1;min-width:180px;}
  .toolbar-row select{width:auto;min-width:140px;}

  details.cat-block{margin-bottom:10px;border-bottom:1px solid var(--line-soft);}
  details.cat-block summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent-dark);padding:8px 0;user-select:none;}
  details.cat-block summary::-webkit-details-marker{display:none;}
  details.cat-block summary::before{content:'▸';display:inline-block;margin-right:6px;transition:transform .15s;}
  details.cat-block[open] summary::before{transform:rotate(90deg);}
  details.cat-block .cat-body{padding-bottom:8px;}

  .summary-box{position:sticky;top:16px;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px 14px;margin-bottom:18px;min-height:20px;}
  .summary-box .chip{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:12.5px;margin:3px 6px 3px 0;}
  .cat-title{font-size:12.5px;font-weight:600;color:var(--accent-dark);text-transform:none;margin:0 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line);}
  .item-row{display:grid;grid-template-columns:1fr 90px 100px;align-items:start;gap:12px;padding:7px 0;}
  .item-row .name{font-size:13.5px;padding-top:6px;}
  .item-row .unit{font-size:12px;color:var(--muted);padding-top:6px;}
  .item-row input{padding:6px 8px;text-align:right;width:100%;}
  .qty-cell{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .stock-warn{font-size:10.5px;color:var(--rust);white-space:nowrap;line-height:1.3;}

  .hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px;}
  .kpi-row{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .kpi{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px 18px;}
  .kpi .num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-top:2px;}

  .filter-row{display:flex;gap:10px;margin-bottom:14px;align-items:center;}
  .filter-row select{width:auto;min-width:120px;}
  .shared-note{font-size:11.5px;color:var(--muted);background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius);padding:8px 12px;margin-bottom:16px;}

  .admin-link{
    padding:6px 14px;font-size:12.5px;cursor:pointer;
    position:fixed;top:14px;right:20px;z-index:40;
    background:var(--surface);color:var(--ink);border:1px solid var(--line);
    border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  .admin-link:hover{background:var(--paper);}

  .modal-overlay{position:fixed;inset:0;background:rgba(33,38,31,0.55);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal-overlay.hidden{display:none;}
  .modal-box{background:#fff;border-radius:var(--radius);padding:26px;width:320px;box-shadow:0 8px 30px rgba(0,0,0,0.25);}
  .modal-box h3{margin:0 0 14px;font-size:15px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;}
  .modal-err{color:var(--rust);font-size:12.5px;margin-top:6px;min-height:16px;}

  @media (max-width: 860px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;}
    .brand{display:none;}
    nav{display:flex;padding:0;}
    .nav-item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;}
    .nav-item.active{border-bottom-color:var(--accent);}
    .sidebar-foot{display:none;}
    .admin-link{
      position:static;background:transparent;color:#B7BDAC;border:none;box-shadow:none;
      border-radius:0;padding:11px 20px;border-top:1px solid rgba(255,255,255,0.12);white-space:nowrap;
    }
    .admin-link:hover{color:#fff;}
    main{padding:20px;}
    .grid2{grid-template-columns:1fr;}
    .item-row{grid-template-columns:1fr 70px 90px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="sidebar">
    <div class="brand">消耗性用品申請系統<small>Consumables Requisition</small></div>
    <nav id="nav"></nav>
    <div class="admin-link" id="admin-link"></div>
  </div>
  <main id="main"></main>
</div>

<div class="modal-overlay hidden" id="login-modal">
  <div class="modal-box">
    <h3>管理者登入</h3>
    <label>密碼</label>
    <input type="password" id="login-pw" placeholder="請輸入管理者密碼">
    <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--muted);">
      <input type="checkbox" id="login-pw-toggle" style="width:auto;"> 顯示密碼
    </label>
    <div class="modal-err" id="login-err"></div>
    <div class="modal-actions">
      <button class="btn ghost small" id="login-cancel">取消</button>
      <button class="btn primary small" id="login-submit">登入</button>
    </div>
  </div>
</div>

<script>
/* ---------------- storage helpers ---------------- */
async function sGet(key, shared=true){
  try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared=true){
  try{ return await window.storage.set(key, value, shared); }
  catch(e){ console.error('storage set failed', key, e); return null; }
}
async function sList(prefix, shared=true){
  try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }
  catch(e){ return []; }
}
async function sDelete(key, shared=true){
  try{ return await window.storage.delete(key, shared); }
  catch(e){ return null; }
}

/* ---------------- Google Sheet API (optional cloud backend) ---------------- */
let SHEET_API_URL = null;
const DEFAULT_SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwdH2Gt72Rq6UUsFtQIqBUFDkoyUWkIo0Zr5CEPc3c07dEV05hJN8UHlJQhiq5nKJg-HQ/exec';
async function apiGet(action){
  if(!SHEET_API_URL) return null;
  try{
    const res = await fetch(`${SHEET_API_URL}?action=${action}`);
    return await res.json();
  }catch(e){ console.error('apiGet failed', e); return null; }
}
async function apiPost(action, payload){
  if(!SHEET_API_URL) return null;
  try{
    const res = await fetch(SHEET_API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action, ...payload }),
    });
    return await res.json();
  }catch(e){ console.error('apiPost failed', e); return null; }
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtTs(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg, kind=''){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 4500);
}

function exportWorkbook(filename, sheets){
  if(typeof XLSX === 'undefined'){ toast('Excel匯出元件載入失敗，請檢查網路連線後重新整理', 'err'); return; }
  try{
    const wb = XLSX.utils.book_new();
    sheets.forEach(s=>{
      const ws = XLSX.utils.aoa_to_sheet(s.rows);
      XLSX.utils.book_append_sheet(wb, ws, s.name);
    });
    XLSX.writeFile(wb, filename);
    toast('已匯出 ' + filename, 'ok');
  }catch(e){
    console.error('export failed', e);
    toast('匯出失敗，請稍後再試', 'err');
  }
}
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
}

/* ---------------- default seed data ---------------- */
const DEFAULT_ITEMS = [
  {id:'itm-a4paper', code:'', name:'A4影印紙', unit:'箱', category:'文具', low:5, opening:0},
  {id:'itm-penblk', code:'', name:'原子筆-黑', unit:'支', category:'文具', low:20, opening:0},
  {id:'itm-notes', code:'', name:'便利貼', unit:'本', category:'文具', low:10, opening:0},
  {id:'itm-clip', code:'', name:'迴紋針', unit:'盒', category:'文具', low:10, opening:0},
  {id:'itm-folder', code:'', name:'L型文件夾', unit:'個', category:'文具', low:15, opening:0},
  {id:'itm-toner', code:'', name:'印表機碳粉匣-黑', unit:'顆', category:'辦公設備耗材', low:3, opening:0},
  {id:'itm-batt', code:'', name:'電池3號', unit:'顆', category:'辦公設備耗材', low:20, opening:0},
  {id:'itm-trash', code:'', name:'垃圾袋(大)', unit:'捆', category:'清潔用品', low:5, opening:0},
  {id:'itm-soap', code:'', name:'洗手乳', unit:'瓶', category:'清潔用品', low:5, opening:0},
  {id:'itm-tissue', code:'', name:'抽取式衛生紙', unit:'箱', category:'清潔用品', low:5, opening:0},
  {id:'itm-filter', code:'', name:'咖啡濾紙', unit:'包', category:'茶水間', low:5, opening:0},
  {id:'itm-cup', code:'', name:'紙杯', unit:'包', category:'茶水間', low:5, opening:0},
];

/* ---------------- state ---------------- */
const DEFAULT_ADMIN_PASSWORD = 'admin1234';

let state = {
  tab: 'request',
  items: [],
  requests: [],
  purchases: [],
  suppliers: [],
  adjustments: [],
  config: { notifyEmail:'', adminPassword:'' },
  loaded: false,
  isAdmin: false,
};

const TABS = [
  {id:'request', label:'提出申請', admin:false},
  {id:'requestList', label:'申請總表', admin:true},
  {id:'purchase', label:'進貨作業', admin:true},
  {id:'stock', label:'庫存總表', admin:true},
  {id:'itemAdmin', label:'品項設定', admin:true},
  {id:'supplierAdmin', label:'供應商管理', admin:true},
  {id:'analytics', label:'分析管理', admin:true},
  {id:'settings', label:'系統設定', admin:true},
];

/* ---------------- data loading ---------------- */
async function loadAll(){
  const savedUrl = await sGet('sheetApiUrl', true);
  SHEET_API_URL = savedUrl || DEFAULT_SHEET_API_URL;

  if(SHEET_API_URL){
    const res = await apiGet('getAll');
    if(res && res.ok){
      state.items = (res.items||[]).map(i=>({...i, low:Number(i.low)||0}));
      state.requests = (res.requests||[]).map(r=>({...r, ts:Number(r.ts)})).sort((a,b)=>b.ts-a.ts);
      state.purchases = (res.purchases||[]).map(p=>({...p, ts:Number(p.ts), qty:Number(p.qty)||0, unitPrice:Number(p.unitPrice)||0})).sort((a,b)=>b.ts-a.ts);
      state.suppliers = res.suppliers || [];
      state.adjustments = (res.adjustments||[]).map(a=>({...a, ts:Number(a.ts), delta:Number(a.delta)||0, countedQty:Number(a.countedQty)||0})).sort((a,b)=>b.ts-a.ts);
      state.config = { notifyEmail:'', adminPassword:'', ...(res.config||{}) };

      if(state.items.length === 0){
        await apiPost('batchAddItems', { data: DEFAULT_ITEMS });
        state.items = DEFAULT_ITEMS.slice();
      }
      state.loaded = true;
      return;
    }
    toast('無法連線到Google試算表，暫時改用本機資料', 'err');
  }

  // ---- fallback: local (Claude storage) mode ----
  let items = await sGet('items');
  if(!items){
    await sSet('items', JSON.stringify(DEFAULT_ITEMS));
    items = JSON.stringify(DEFAULT_ITEMS);
  }
  state.items = JSON.parse(items);

  const reqKeys = await sList('req:');
  const reqs = [];
  for(const k of reqKeys){
    const v = await sGet(k);
    if(v){ try{ reqs.push(JSON.parse(v)); }catch(e){} }
  }
  reqs.sort((a,b)=> b.ts - a.ts);
  state.requests = reqs;

  const purKeys = await sList('pur:');
  const purs = [];
  for(const k of purKeys){
    const v = await sGet(k);
    if(v){ try{ purs.push(JSON.parse(v)); }catch(e){} }
  }
  purs.sort((a,b)=> b.ts - a.ts);
  state.purchases = purs;

  let suppliers = await sGet('suppliers');
  if(!suppliers){ suppliers = '[]'; await sSet('suppliers', suppliers); }
  state.suppliers = JSON.parse(suppliers);

  const adjKeys = await sList('adj:');
  const adjs = [];
  for(const k of adjKeys){
    const v = await sGet(k);
    if(v){ try{ adjs.push(JSON.parse(v)); }catch(e){} }
  }
  adjs.sort((a,b)=> b.ts - a.ts);
  state.adjustments = adjs;

  const cfg = await sGet('config');
  if(cfg){ try{ state.config = { ...state.config, ...JSON.parse(cfg) }; }catch(e){} }

  state.loaded = true;
}

/* ---------------- inventory calc ---------------- */
function computeStock(){
  const map = {};
  for(const it of state.items){
    map[it.id] = { item: it, purchased: 0, approvedReq: 0, adjusted: 0, costNum: 0, costDen: 0 };
  }
  for(const p of state.purchases){
    const row = map[p.itemId];
    if(!row) continue;
    row.purchased += Number(p.qty)||0;
    if(Number(p.unitPrice) > 0){
      row.costNum += Number(p.qty) * Number(p.unitPrice);
      row.costDen += Number(p.qty);
    }
  }
  for(const r of state.requests){
    if(r.status !== 'approved') continue;
    for(const line of r.items){
      if(map[line.itemId]) map[line.itemId].approvedReq += Number(line.qty)||0;
    }
  }
  for(const a of state.adjustments){
    if(map[a.itemId]) map[a.itemId].adjusted += Number(a.delta)||0;
  }
  return Object.values(map).map(row => {
    const opening = Number(row.item.opening)||0;
    const stock = opening + row.purchased - row.approvedReq + row.adjusted;
    const avgCost = row.costDen > 0 ? row.costNum / row.costDen : 0;
    return { ...row, opening, stock, avgCost, value: stock * avgCost };
  });
}

/* ---------------- stock adjustment (盤點) ---------------- */
function computeCurrentStockFor(itemId){
  const rows = computeStock();
  const row = rows.find(r=>r.item.id === itemId);
  return row ? row.stock : 0;
}

/* ---------------- render root ---------------- */
function renderNav(){
  const nav = document.getElementById('nav');
  const visible = TABS.filter(t => !t.admin || state.isAdmin);
  nav.innerHTML = visible.map(t => `
    <div class="nav-item ${state.tab===t.id?'active':''}" data-tab="${t.id}">
      <span class="dot"></span>${t.label}
    </div>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ state.tab = el.dataset.tab; render(); });
  });

  const adminLink = document.getElementById('admin-link');
  adminLink.textContent = state.isAdmin ? '登出管理者模式' : '管理者登入';
  adminLink.onclick = () => {
    if(state.isAdmin){
      state.isAdmin = false;
      state.tab = 'request';
      render();
    } else {
      openLoginModal();
    }
  };
}

function openLoginModal(){
  const modal = document.getElementById('login-modal');
  const pwInput = document.getElementById('login-pw');
  const pwToggle = document.getElementById('login-pw-toggle');
  const err = document.getElementById('login-err');
  pwInput.value = '';
  pwInput.type = 'password';
  pwToggle.checked = false;
  err.textContent = '';
  modal.classList.remove('hidden');
  pwInput.focus();

  pwToggle.onchange = () => { pwInput.type = pwToggle.checked ? 'text' : 'password'; };

  const doLogin = () => {
    const expected = state.config.adminPassword || DEFAULT_ADMIN_PASSWORD;
    if(pwInput.value === expected){
      state.isAdmin = true;
      modal.classList.add('hidden');
      state.tab = 'requestList';
      render();
    } else {
      err.textContent = '密碼錯誤，請再試一次';
    }
  };
  document.getElementById('login-submit').onclick = doLogin;
  pwInput.onkeydown = (e) => { if(e.key === 'Enter') doLogin(); };
  document.getElementById('login-cancel').onclick = () => modal.classList.add('hidden');
}

function render(){
  if(!state.isAdmin && state.tab !== 'request') state.tab = 'request';
  renderNav();
  const main = document.getElementById('main');
  if(!state.loaded){ main.innerHTML = `<div class="empty">載入中...</div>`; return; }
  switch(state.tab){
    case 'request': main.innerHTML = viewRequestForm(); bindRequestForm(); break;
    case 'requestList': main.innerHTML = viewRequestList(); bindRequestList(); break;
    case 'purchase': main.innerHTML = viewPurchase(); bindPurchase(); break;
    case 'stock': { const rows = computeStock(); main.innerHTML = viewStock(rows); bindStock(rows); break; }
    case 'itemAdmin': main.innerHTML = viewItemAdmin(); bindItemAdmin(); break;
    case 'supplierAdmin': main.innerHTML = viewSupplierAdmin(); bindSupplierAdmin(); break;
    case 'analytics': main.innerHTML = viewAnalytics(); bindAnalytics(); break;
    case 'settings': main.innerHTML = viewSettings(); bindSettings(); break;
  }
}

/* ================= 提出申請 ================= */
function groupByCategory(items){
  const g = {};
  for(const it of items){ (g[it.category] ||= []).push(it); }
  Object.values(g).forEach(list=>{
    list.sort((a,b)=> (a.code||'').localeCompare(b.code||'', undefined, {numeric:true}) || a.name.localeCompare(b.name));
  });
  return g;
}

function viewRequestForm(){
  const groups = groupByCategory(state.items);
  const categories = Object.keys(groups);
  const catOptions = categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');

  const stockMap = {};
  computeStock().forEach(r=>{ stockMap[r.item.id] = r.stock; });

  const catBlocks = Object.entries(groups).map(([cat, list])=>`
    <details class="cat-block" data-category="${esc(cat)}" open>
      <summary class="cat-title">${esc(cat)}（${list.length}項）</summary>
      <div class="cat-body">
        ${list.map(it=>`
          <div class="item-row" data-name="${esc(((it.code?it.code+' ':'')+it.name).toLowerCase())}">
            <div class="name">${it.code ? `<span class="mono" style="color:var(--muted);font-size:11px;margin-right:6px;">${esc(it.code)}</span>` : ''}${esc(it.name)}</div>
            <div class="unit">${esc(it.unit)}</div>
            <div class="qty-cell">
              <input type="number" min="0" step="1" value="0" class="mono qty-input" data-item="${it.id}" data-stock="${stockMap[it.id] ?? 0}">
              <span class="stock-warn" id="warn-${it.id}"></span>
            </div>
          </div>
        `).join('')}
      </div>
    </details>
  `).join('');

  return `
    <div class="page-head">
      <h1>消耗性用品申請</h1>
      <p>選擇需要的品項與數量，填寫申請人資訊後送出。送出後將記錄於申請總表，並寄送通知信。</p>
    </div>
    <div class="panel">
      <h2>申請人資訊</h2>
      <div class="grid2">
        <div class="field"><label>姓名 *</label><input type="text" id="f-applicant" placeholder="王小明"></div>
        <div class="field"><label>部門 *</label>
          <select id="f-dept">
            <option value="">請選擇部門</option>
            <option value="管理部">管理部</option>
            <option value="業務部">業務部</option>
            <option value="技術服務部">技術服務部</option>
            <option value="資安系統部">資安系統部</option>
          </select>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>選擇申請項目</h2>
      <div class="toolbar-row">
        <input type="text" id="item-search" placeholder="搜尋品項名稱...">
        <select id="cat-filter">
          <option value="all">全部分類</option>
          ${catOptions}
        </select>
      </div>
      <div class="summary-box" id="selected-summary">
        <span class="hint" style="margin:0;">尚未選擇任何項目</span>
      </div>
      ${catBlocks || '<div class="empty">尚無可申請品項，請至「品項設定」新增。</div>'}
    </div>
    <div class="panel">
      <h2>備註</h2>
      <textarea id="f-note" placeholder="其他說明（選填）"></textarea>
    </div>
    <button class="btn primary" id="submit-request">送出申請</button>
  `;
}

function updateSelectedSummary(){
  const el = document.getElementById('selected-summary');
  if(!el) return;
  const selected = [];
  document.querySelectorAll('.qty-input').forEach(inp=>{
    const qty = Number(inp.value)||0;
    if(qty>0){
      const item = state.items.find(i=>i.id===inp.dataset.item);
      if(item) selected.push({ name:item.name, unit:item.unit, qty });
    }
  });
  if(selected.length===0){
    el.innerHTML = '<span class="hint" style="margin:0;">尚未選擇任何項目</span>';
    return;
  }
  el.innerHTML = `<strong style="font-size:12.5px;">已選 ${selected.length} 項：</strong> ` +
    selected.map(s=>`<span class="chip">${esc(s.name)} x ${s.qty}${esc(s.unit)}</span>`).join('');
}

function applyItemFilter(){
  const q = (document.getElementById('item-search').value || '').trim().toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  document.querySelectorAll('details.cat-block').forEach(block=>{
    const blockCat = block.dataset.category;
    const catMatches = cat === 'all' || cat === blockCat;
    let anyVisible = false;
    block.querySelectorAll('.item-row').forEach(row=>{
      const show = catMatches && (!q || row.dataset.name.includes(q));
      row.style.display = show ? '' : 'none';
      if(show) anyVisible = true;
    });
    block.style.display = anyVisible ? '' : 'none';
    if(q && anyVisible) block.open = true;
  });
}

function checkStockWarning(inp){
  const warnEl = document.getElementById('warn-'+inp.dataset.item);
  if(!warnEl) return;
  const qty = Number(inp.value)||0;
  const stock = Number(inp.dataset.stock)||0;
  if(qty > 0 && qty > stock){
    warnEl.textContent = `庫存不足（現有${stock}）`;
  } else {
    warnEl.textContent = '';
  }
}

function bindRequestForm(){
  document.getElementById('item-search').addEventListener('input', applyItemFilter);
  document.getElementById('cat-filter').addEventListener('change', applyItemFilter);
  document.querySelectorAll('.qty-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{ updateSelectedSummary(); checkStockWarning(inp); });
  });

  document.getElementById('submit-request').addEventListener('click', async ()=>{
    const applicant = document.getElementById('f-applicant').value.trim();
    const dept = document.getElementById('f-dept').value;
    const note = document.getElementById('f-note').value.trim();
    if(!applicant){ toast('請填寫申請人姓名', 'err'); return; }
    if(!dept){ toast('請選擇部門', 'err'); return; }

    const lines = [];
    document.querySelectorAll('.qty-input').forEach(inp=>{
      const qty = Number(inp.value)||0;
      if(qty > 0){
        const item = state.items.find(i=>i.id===inp.dataset.item);
        if(item) lines.push({ itemId:item.id, name:item.name, unit:item.unit, qty });
      }
    });
    if(lines.length===0){ toast('請至少選擇一項數量大於 0 的品項', 'err'); return; }

    const btn = document.getElementById('submit-request');
    btn.disabled = true; btn.textContent = '送出中...';

    const record = {
      id: uid(), ts: Date.now(), applicant, dept, note,
      items: lines, status: 'pending',
    };

    let saved = false;
    let mailSent = false;
    let cloudMode = !!SHEET_API_URL;
    if(SHEET_API_URL){
      const res = await apiPost('addRequest', { data: record });
      saved = !!(res && res.ok);
      mailSent = !!(res && res.mailSent);
    } else {
      saved = await sSet('req:'+record.id, JSON.stringify(record));
    }
    if(!saved){
      toast('儲存失敗，請稍後再試', 'err');
      btn.disabled = false; btn.textContent = '送出申請';
      return;
    }
    state.requests.unshift(record);

    btn.disabled = false; btn.textContent = '送出申請';
    document.getElementById('f-applicant').value='';
    document.getElementById('f-dept').value='';
    document.getElementById('f-note').value='';
    document.querySelectorAll('.qty-input').forEach(i=>{ i.value=0; checkStockWarning(i); });
    updateSelectedSummary();

    if(!cloudMode){
      toast('申請已送出（本機模式暫不支援自動寄信，請先連接Google試算表）', 'ok');
    } else if(mailSent){
      toast('申請已送出，通知信已寄出', 'ok');
    } else if(!state.config.notifyEmail){
      toast('申請已送出（尚未設定通知信箱，請至「系統設定」填寫）', 'ok');
    } else {
      toast('申請已送出，但Email通知寄送失敗，請檢查系統設定與Apps Script部署', 'err');
    }
  });
}

/* ================= 申請總表 ================= */
function statusLabel(s){
  return { pending:'待審核', approved:'已核准', rejected:'已拒絕' }[s] || s;
}
function statusBadge(s){
  const clsMap = { pending:'pending', approved:'approved', rejected:'rejected' };
  return `<span class="badge ${clsMap[s]||'pending'}">${statusLabel(s)}</span>`;
}

function viewRequestList(){
  const rows = state.requests;
  const pending = rows.filter(r=>r.status==='pending').length;
  const approved = rows.filter(r=>r.status==='approved').length;
  return `
    <div class="page-head">
      <h1>申請總表</h1>
      <p>所有同仁送出的耗材申請紀錄。核准後將自動從庫存扣除對應數量。</p>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="num mono">${rows.length}</div><div class="lbl">總申請筆數</div></div>
      <div class="kpi"><div class="num mono">${pending}</div><div class="lbl">待審核</div></div>
      <div class="kpi"><div class="num mono">${approved}</div><div class="lbl">已核准</div></div>
    </div>
    <div class="panel">
      <div class="filter-row" style="justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <label style="margin:0;">狀態</label>
          <select id="filter-status">
            <option value="all">全部</option>
            <option value="pending">待審核</option>
            <option value="approved">已核准</option>
            <option value="rejected">已拒絕</option>
          </select>
          <label style="margin:0;">起始日期</label>
          <input type="date" id="filter-start" style="width:auto;">
          <label style="margin:0;">結束日期</label>
          <input type="date" id="filter-end" style="width:auto;">
        </div>
        <button class="btn ghost small" id="export-requests">匯出Excel</button>
      </div>
      <div id="req-table"></div>
    </div>
  `;
}

function getFilteredRequests(){
  const filter = document.getElementById('filter-status').value;
  const startVal = document.getElementById('filter-start').value;
  const endVal = document.getElementById('filter-end').value;
  const startTs = startVal ? new Date(startVal+'T00:00:00').getTime() : null;
  const endTs = endVal ? new Date(endVal+'T23:59:59').getTime() : null;
  return state.requests.filter(r=>{
    if(filter !== 'all' && r.status !== filter) return false;
    if(startTs !== null && r.ts < startTs) return false;
    if(endTs !== null && r.ts > endTs) return false;
    return true;
  });
}

function renderReqTable(){
  const rows = getFilteredRequests();
  const el = document.getElementById('req-table');
  if(rows.length===0){ el.innerHTML = '<div class="empty">尚無符合條件的申請紀錄</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>時間</th><th>申請人</th><th>部門</th><th>項目明細</th><th>備註</th><th>狀態</th><th>操作</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td class="mono">${fmtTs(r.ts)}</td>
            <td>${esc(r.applicant)}</td>
            <td>${esc(r.dept||'-')}</td>
            <td>${r.items.map(l=>`${esc(l.name)} x ${l.qty}${esc(l.unit)}`).join('<br>')}</td>
            <td>${esc(r.note||'-')}</td>
            <td>${statusBadge(r.status)}</td>
            <td>
              ${r.status==='pending' ? `
                <button class="btn small teal-o" data-act="approve" data-id="${r.id}">核准</button>
                <button class="btn small danger-o" data-act="reject" data-id="${r.id}">拒絕</button>
              ` : `<button class="btn small ghost" data-act="reset" data-id="${r.id}">改為待審核</button>`}
              <button class="btn small danger-o" data-act="delete" data-id="${r.id}">刪除</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  el.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      const rec = state.requests.find(r=>r.id===id);
      if(!rec) return;

      if(act === 'delete'){
        if(!confirm(`確定要刪除 ${rec.applicant} 的這筆申請紀錄嗎？刪除後無法復原，且會一併從庫存計算中移除。`)) return;
        state.requests = state.requests.filter(r=>r.id!==id);
        if(SHEET_API_URL){ await apiPost('deleteRequest', { id }); }
        else { await sDelete('req:'+id); }
        toast('申請紀錄已刪除', 'ok');
        renderReqTable();
        return;
      }

      const newStatus = act==='approve' ? 'approved' : act==='reject' ? 'rejected' : 'pending';
      rec.status = newStatus;
      if(SHEET_API_URL){ await apiPost('updateRequestStatus', { id, status: newStatus }); }
      else { await sSet('req:'+id, JSON.stringify(rec)); }
      toast('狀態已更新', 'ok');
      renderReqTable();
    });
  });
}

function bindRequestList(){
  renderReqTable();
  document.getElementById('filter-status').addEventListener('change', renderReqTable);
  document.getElementById('filter-start').addEventListener('change', renderReqTable);
  document.getElementById('filter-end').addEventListener('change', renderReqTable);
  document.getElementById('export-requests').addEventListener('click', ()=>{
    const rows = getFilteredRequests();
    if(rows.length===0){ toast('目前沒有可匯出的資料', 'err'); return; }
    const detail = [['日期','申請人','部門','品項','數量','單位','狀態','備註']];
    rows.forEach(r=>{
      r.items.forEach(l=>{
        detail.push([fmtTs(r.ts), r.applicant, r.dept||'', l.name, l.qty, l.unit, statusLabel(r.status), r.note||'']);
      });
    });
    const summary = [['日期','申請人','部門','項目明細','備註','狀態']];
    rows.forEach(r=>{
      summary.push([fmtTs(r.ts), r.applicant, r.dept||'', r.items.map(l=>`${l.name} x ${l.qty}${l.unit}`).join('; '), r.note||'', statusLabel(r.status)]);
    });
    exportWorkbook(`申請總表_${todayStr()}.xlsx`, [
      { name:'申請明細', rows: detail },
      { name:'申請單彙總', rows: summary },
    ]);
  });
}

      <tbody>
        ${state.purchases.map(p=>`
          <tr>
            <td class="mono">${fmtTs(p.ts)}</td>
            <td>${esc(p.itemName)}</td>
            <td class="mono">${p.qty}${esc(p.unit)}</td>
            <td class="mono">${p.unitPrice ? '$'+Number(p.unitPrice).toLocaleString() : '-'}</td>
            <td class="mono">${p.unitPrice ? '$'+(p.qty*p.unitPrice).toLocaleString() : '-'}</td>
            <td>${esc(p.supplier||'-')}</td>

    state.purchases.forEach(p=>{

    });
    exportWorkbook(`進貨總表_${todayStr()}.xlsx`, [{ name:'進貨總表', rows }]);
  });
  document.getElementById('submit-purchase').addEventListener('click', async ()=>{
    const itemId = document.getElementById('p-item').value;
    const qty = Number(document.getElementById('p-qty').value)||0;
    const unitPrice = Number(document.getElementById('p-price').value)||0;
    const supplier = supSelect.value === '__other__' ? supOther.value.trim() : supSelect.value;
    const note = document.getElementById('p-note').value.trim();
    if(qty<=0){ toast('數量需大於 0', 'err'); return; }
    const item = state.items.find(i=>i.id===itemId);
    if(!item) return;
    const record = { id: uid(), ts: Date.now(), itemId, itemName:item.name, unit:item.unit, qty, unitPrice, supplier, note };
    let saved;
    if(SHEET_API_URL){
      const res = await apiPost('addPurchase', { data: record });
      saved = !!(res && res.ok);
    } else {
      saved = await sSet('pur:'+record.id, JSON.stringify(record));
    }
    if(!saved){ toast('儲存失敗，請稍後再試', 'err'); return; }
    state.purchases.unshift(record);
    toast('進貨紀錄已新增', 'ok');
    render();
    state.tab = 'purchase';
  });

  document.getElementById('download-purchase-template').addEventListener('click', ()=>{
    const sampleName = state.items[0] ? state.items[0].name : 'A4影印紙';
    exportWorkbook('進貨匯入範本.xlsx', [{
      name: '進貨',
      rows: [
        ['品項名稱','數量','單價','供應商','備註'],
        [sampleName, 10, 85, '○○文具行', ''],
      ],
    }]);
  });

  let pendingPurchaseRows = [];
  const purFileInput = document.getElementById('import-purchase-file');
  const purImportBtn = document.getElementById('import-purchases');
  const purPreviewEl = document.getElementById('import-purchase-preview');

  purFileInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    pendingPurchaseRows = [];
    purImportBtn.disabled = true;
    if(!file) return;
    if(typeof XLSX === 'undefined'){ toast('匯入元件載入失敗，請檢查網路連線後重新整理', 'err'); return; }
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      const parsed = rows.map(r=>{
        const itemName = String(r['品項名稱'] ?? r['name'] ?? '').trim();
        const matchedItem = state.items.find(i=>i.name === itemName);
        return {
          itemName,
          item: matchedItem,
          qty: Number(r['數量'] ?? r['qty'] ?? 0) || 0,
          unitPrice: Number(r['單價'] ?? r['unitPrice'] ?? 0) || 0,
          supplier: String(r['供應商'] ?? r['supplier'] ?? '').trim(),
          note: String(r['備註'] ?? r['note'] ?? '').trim(),
        };
      }).filter(r => r.itemName && r.qty > 0);

      const matched = parsed.filter(r=>r.item);
      const unmatched = parsed.filter(r=>!r.item);
      pendingPurchaseRows = matched;

      if(parsed.length === 0){
        purPreviewEl.innerHTML = '<div class="empty">找不到可匯入的資料，請確認表頭與數量欄位</div>';
      } else {
        purPreviewEl.innerHTML = `
          <div class="hint">
            可匯入 <strong>${matched.length}</strong> 筆
            ${unmatched.length > 0 ? `，另有 <strong style="color:var(--rust)">${unmatched.length}</strong> 筆找不到對應品項名稱、將被略過` : ''}
          </div>
          <table style="margin-top:8px;">
            <thead><tr><th>品項名稱</th><th>數量</th><th>單價</th><th>供應商</th><th>狀態</th></tr></thead>
            <tbody>
              ${parsed.slice(0,8).map(r=>`
                <tr>
                  <td>${esc(r.itemName)}</td>
                  <td class="mono">${r.qty}</td>
                  <td class="mono">${r.unitPrice}</td>
                  <td>${esc(r.supplier||'-')}</td>
                  <td>${r.item ? '<span class="badge ok">OK</span>' : '<span class="badge low">找不到品項</span>'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        purImportBtn.disabled = matched.length === 0;
      }
    }catch(err){
      console.error('purchase import parse failed', err);
      toast('檔案讀取失敗，請確認是否為正確的Excel/CSV格式', 'err');
      purPreviewEl.innerHTML = '';
    }
  });

  purImportBtn.addEventListener('click', async ()=>{
    if(pendingPurchaseRows.length === 0) return;
    purImportBtn.disabled = true; purImportBtn.textContent = '匯入中...';
    const now = Date.now();
    const newRecords = pendingPurchaseRows.map(r => ({
      id: uid(), ts: now, itemId:r.item.id, itemName:r.item.name, unit:r.item.unit,
      qty:r.qty, unitPrice:r.unitPrice, supplier:r.supplier, note:r.note,
    }));
    state.purchases.unshift(...newRecords);
    if(SHEET_API_URL){
      const res = await apiPost('batchAddPurchases', { data: newRecords });
      if(!res || !res.ok){ toast('批次匯入寫入試算表失敗，請稍後重試', 'err'); }
    } else {
      for(const rec of newRecords){ await sSet('pur:'+rec.id, JSON.stringify(rec)); }
    }
    pendingPurchaseRows = [];
    toast(`已匯入 ${newRecords.length} 筆進貨紀錄`, 'ok');
    render();
  });
}

function renderAdjTable(){
  const el = document.getElementById('adj-table');
  if(state.adjustments.length === 0){ el.innerHTML = '<div class="empty">尚無盤點調整紀錄</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr><th>時間</th><th>品項</th><th>盤點數量</th><th>差異</th><th>備註</th><th>操作</th></tr></thead>
      <tbody>
        ${state.adjustments.map(a=>`
          <tr>
            <td class="mono">${fmtTs(a.ts)}</td>
            <td>${esc(a.itemName)}</td>
            <td class="mono">${a.countedQty}${esc(a.unit||'')}</td>
            <td class="mono">${a.delta > 0 ? '+' : ''}${a.delta}</td>
            <td>${esc(a.note||'-')}</td>
            <td><button class="btn small danger-o" data-del-adj="${a.id}">刪除</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  el.querySelectorAll('button[data-del-adj]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('確定要刪除這筆盤點調整紀錄嗎？刪除後庫存計算會恢復成調整前的數字。')) return;
      const id = btn.dataset.delAdj;
      state.adjustments = state.adjustments.filter(a=>a.id!==id);
      if(SHEET_API_URL){ await apiPost('deleteAdjustment', { id }); }
      else { await sDelete('adj:'+id); }
      toast('盤點紀錄已刪除', 'ok');
      render();
    });
  });
}

function bindStock(rows){
  document.getElementById('export-stock').addEventListener('click', ()=>{
    if(rows.length===0){ toast('目前沒有可匯出的資料', 'err'); return; }
    const out = [['品項','分類','單位','期初庫存','累計進貨','已核准申請','盤點調整','目前庫存','安全庫存','庫存金額','狀態']];
    rows.forEach(r=>{
      out.push([r.item.name, r.item.category, r.item.unit, r.opening, r.purchased, r.approvedReq, r.adjusted, r.stock, r.item.low, Math.round(r.value||0), r.stock<=r.item.low?'庫存偏低':'正常']);
    });
    exportWorkbook(`庫存總表_${todayStr()}.xlsx`, [{ name:'庫存總表', rows: out }]);
  });

  const itemSelect = document.getElementById('adj-item');
  const countedInput = document.getElementById('adj-counted');
  const previewEl = document.getElementById('adj-preview');

  function updateAdjPreview(){
    const itemId = itemSelect.value;
    const counted = countedInput.value === '' ? null : Number(countedInput.value);
    const current = computeCurrentStockFor(itemId);
    if(counted === null){
      previewEl.textContent = `系統目前計算的庫存為 ${current}，請輸入實際盤點數量。`;
    } else {
      const delta = counted - current;
      previewEl.innerHTML = `系統目前庫存 <strong>${current}</strong>，實際盤點 <strong>${counted}</strong>，將記錄差異：<strong style="color:${delta===0?'var(--teal)':'var(--rust)'}">${delta>0?'+':''}${delta}</strong>`;
    }
  }
  itemSelect.addEventListener('change', updateAdjPreview);
  countedInput.addEventListener('input', updateAdjPreview);
  updateAdjPreview();

  document.getElementById('submit-adjustment').addEventListener('click', async ()=>{
    const itemId = itemSelect.value;
    const item = state.items.find(i=>i.id===itemId);
    if(!item) return;
    if(countedInput.value === ''){ toast('請輸入實際盤點數量', 'err'); return; }
    const counted = Number(countedInput.value)||0;
    const current = computeCurrentStockFor(itemId);
    const delta = counted - current;
    const note = document.getElementById('adj-note').value.trim();
    if(delta === 0){ toast('盤點數量與系統計算相同，沒有差異需要記錄', 'ok'); return; }

    const record = { id: uid(), ts: Date.now(), itemId, itemName:item.name, unit:item.unit, delta, countedQty:counted, note };
    let saved;
    if(SHEET_API_URL){
      const res = await apiPost('addAdjustment', { data: record });
      saved = !!(res && res.ok);
    } else {
      saved = await sSet('adj:'+record.id, JSON.stringify(record));
    }
    if(!saved){ toast('儲存失敗，請稍後再試', 'err'); return; }
    state.adjustments.unshift(record);
    toast(`已記錄盤點差異：${delta>0?'+':''}${delta}`, 'ok');
    render();
  });

  renderAdjTable();
}

          </table>
        `;
        importBtn.disabled = false;
      }
    }catch(err){
      console.error('import parse failed', err);
      toast('檔案讀取失敗，請確認是否為正確的Excel/CSV格式', 'err');
      previewEl.innerHTML = '';
    }
  });

  importBtn.addEventListener('click', async ()=>{
    if(pendingImportRows.length === 0) return;
    importBtn.disabled = true; importBtn.textContent = '匯入中...';
    const newItems = pendingImportRows.map(r => ({
      id:'itm-'+uid(), code:r.code, name:r.name, unit:r.unit, category:r.category, low:r.low, opening:r.opening
    }));
    state.items.push(...newItems);
    if(SHEET_API_URL){
      const res = await apiPost('batchAddItems', { data: newItems });
      if(!res || !res.ok){ toast('批次匯入寫入試算表失敗，請稍後重試', 'err'); }
    } else {
      await sSet('items', JSON.stringify(state.items));
    }
    pendingImportRows = [];
    toast(`已匯入 ${newItems.length} 筆品項`, 'ok');
    render();
  });
}

function bindSupplierAdmin(){
  let editingId = null;
  const nameEl = document.getElementById('s-name');
  const contactEl = document.getElementById('s-contact');
  const phoneEl = document.getElementById('s-phone');
  const noteEl = document.getElementById('s-note');
  const submitBtn = document.getElementById('add-supplier');
  const cancelBtn = document.getElementById('cancel-edit-supplier');
  const titleEl = document.getElementById('supplier-form-title');

  function resetForm(){
    editingId = null;
    nameEl.value=''; contactEl.value=''; phoneEl.value=''; noteEl.value='';
    submitBtn.textContent = '新增供應商';
    cancelBtn.style.display = 'none';
    titleEl.textContent = '新增供應商';
  }

  submitBtn.addEventListener('click', async ()=>{
    const name = nameEl.value.trim();
    const contact = contactEl.value.trim();
    const phone = phoneEl.value.trim();
    const note = noteEl.value.trim();
    if(!name){ toast('請填寫供應商名稱', 'err'); return; }

    if(editingId){
      const supplier = { id: editingId, name, contact, phone, note };
      const idx = state.suppliers.findIndex(s=>s.id===editingId);
      if(idx > -1) state.suppliers[idx] = supplier;
      if(SHEET_API_URL){ await apiPost('updateSupplier', { data: supplier }); }
      else { await sSet('suppliers', JSON.stringify(state.suppliers)); }

      state.suppliers.push(supplier);
      if(SHEET_API_URL){ await apiPost('addSupplier', { data: supplier }); }
      else { await sSet('suppliers', JSON.stringify(state.suppliers)); }
      toast('供應商已新增', 'ok');
    }
    render();
  });

  cancelBtn.addEventListener('click', resetForm);

  document.querySelectorAll('button[data-edit-sup]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sup = state.suppliers.find(s=>s.id===btn.dataset.editSup);

      toast('供應商已刪除', 'ok');
      render();
    });
  });
}

/* ================= 分析管理 ================= */
const DIMENSION_LABELS = { applicant:'申請人', dept:'部門', item:'項目明細' };
const SUB_LABELS = { applicant:'品項明細', dept:'品項明細', item:'申請人明細' };

function computeAnalyticsReport(dimension, startTs, endTs){
  const filtered = state.requests.filter(r=>{
    if(startTs !== null && r.ts < startTs) return false;
    if(endTs !== null && r.ts > endTs) return false;
    return true;
  });

  const map = {};
  if(dimension === 'item'){
    filtered.forEach(r=>{
      const subKey = r.applicant || '未填寫';
      r.items.forEach(l=>{
        if(!map[l.name]) map[l.name] = { count:0, totalQty:0, sub:{} };
        map[l.name].count += 1;
        map[l.name].totalQty += Number(l.qty)||0;
        map[l.name].sub[subKey] = (map[l.name].sub[subKey]||0) + (Number(l.qty)||0);
      });
    });
  } else {
    filtered.forEach(r=>{
      const key = dimension === 'applicant' ? (r.applicant || '未填寫') : (r.dept || '未填寫');
      if(!map[key]) map[key] = { count:0, totalQty:0, sub:{} };
      map[key].count += 1;
      r.items.forEach(l=>{
        map[key].totalQty += Number(l.qty)||0;
        map[key].sub[l.name] = (map[key].sub[l.name]||0) + (Number(l.qty)||0);
      });
    });
  }

  const rows = Object.entries(map)
    .map(([name, v])=>({
      name, count:v.count, totalQty:v.totalQty,
      sub: Object.entries(v.sub)
        .map(([n,q])=>({ name:n, qty:q }))
        .sort((a,b)=> b.qty - a.qty),
    }))
    .sort((a,b)=> b.totalQty - a.totalQty);

  return { rows, requestCount: filtered.length };
}

  return `
    <div class="page-head">
      <h1>分析管理</h1>
      <p>選擇日期區間與分析維度，統計申請總表的數量分佈，可匯出Excel。</p>
    </div>

function bindAnalytics(){
  let lastReport = null;
  let lastDimension = null;
  let lastRangeLabel = '';
  let lastStartTs = null;
  let lastEndTs = null;

  document.getElementById('az-run').addEventListener('click', ()=>{
    const dimension = document.getElementById('az-dimension').value;
    const startVal = document.getElementById('az-start').value;
    const endVal = document.getElementById('az-end').value;
    const startTs = startVal ? new Date(startVal+'T00:00:00').getTime() : null;
    const endTs = endVal ? new Date(endVal+'T23:59:59').getTime() : null;

    const report = computeAnalyticsReport(dimension, startTs, endTs);
    lastReport = report;
    lastDimension = dimension;
    lastRangeLabel = `${startVal||'不限'} ~ ${endVal||'不限'}`;
    lastStartTs = startTs;
    lastEndTs = endTs;

    const label = DIMENSION_LABELS[dimension];
    const panel = document.getElementById('az-result-panel');
    const titleEl = document.getElementById('az-result-title');
    const tableEl = document.getElementById('az-result-table');
    panel.style.display = '';
    titleEl.textContent = `依${label}分析（區間內共 ${report.requestCount} 筆申請）`;

    if(report.rows.length === 0){
      tableEl.innerHTML = '<div class="empty">此區間內沒有符合的申請紀錄</div>';
      return;
    }
    const subLabel = SUB_LABELS[dimension];
    tableEl.innerHTML = `
      <table>
        <thead><tr><th>${label}</th><th>申請筆數</th><th>總數量</th><th>${subLabel}</th></tr></thead>
        <tbody>
          ${report.rows.map(r=>`
            <tr>
              <td>${esc(r.name)}</td>
              <td class="mono">${r.count}</td>
              <td class="mono">${r.totalQty}</td>
              <td>${r.sub.map(s=>`${esc(s.name)} x ${s.qty}`).join('<br>')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  });

  document.getElementById('az-export').addEventListener('click', ()=>{
    if(!lastReport || lastReport.rows.length === 0){ toast('目前沒有可匯出的報表，請先產出報表', 'err'); return; }
    const label = DIMENSION_LABELS[lastDimension];
    const subLabel = SUB_LABELS[lastDimension];

    const summary = [[label, subLabel, `${subLabel}數量`, '申請筆數合計', '總數量合計']];
    lastReport.rows.forEach(r=>{
      if(r.sub.length === 0){
        summary.push([r.name, '', '', r.count, r.totalQty]);
      } else {
        r.sub.forEach(s=>{
          summary.push([r.name, s.name, s.qty, r.count, r.totalQty]);
        });
      }
    });
    summary.push([]);
    summary.push(['區間', lastRangeLabel]);
    summary.push(['區間內申請總筆數', lastReport.requestCount]);

    // 不受目前選擇的分析維度影響，固定產出「申請人 x 品項」逐列明細，方便直接拉樞紐分析表
    const filtered = state.requests.filter(r=>{
      if(lastStartTs !== null && r.ts < lastStartTs) return false;
      if(lastEndTs !== null && r.ts > lastEndTs) return false;
      return true;
    });
    const pivotDetail = [['日期','申請人','部門','品項','數量','單位','狀態']];
    filtered.forEach(r=>{
      r.items.forEach(l=>{
        pivotDetail.push([fmtTs(r.ts), r.applicant, r.dept||'', l.name, l.qty, l.unit, statusLabel(r.status)]);
      });
    });

    exportWorkbook(`分析報表_${label}_${todayStr()}.xlsx`, [
      { name: `依${label}分析`, rows: summary },
      { name: '申請人-品項明細(可樞紐分析)', rows: pivotDetail },
    ]);
  });
}

function bindSettings(){
  document.getElementById('save-sheeturl').addEventListener('click', async ()=>{
    const url = document.getElementById('c-sheeturl').value.trim();
    await sSet('sheetApiUrl', url, true);
    toast(url ? '已儲存，正在重新連線...' : '已改回使用系統內建儲存', 'ok');
    state.loaded = false;
    render();
    await loadAll();
    render();
  });
  document.getElementById('save-settings').addEventListener('click', async ()=>{
    state.config = {
      ...state.config,
      notifyEmail: document.getElementById('c-notify').value.trim(),
    };
    if(SHEET_API_URL){ await apiPost('saveConfig', { data: state.config }); }
    else { await sSet('config', JSON.stringify(state.config)); }
    toast('設定已儲存', 'ok');
  });
  document.getElementById('c-pw-toggle').addEventListener('change', (e)=>{
    document.getElementById('c-pw').type = e.target.checked ? 'text' : 'password';
  });
  document.getElementById('save-pw').addEventListener('click', async ()=>{
    const pw = document.getElementById('c-pw').value;
    if(!pw || pw.length < 4){ toast('密碼至少需 4 碼', 'err'); return; }
    state.config = { ...state.config, adminPassword: pw };
    if(SHEET_API_URL){ await apiPost('saveConfig', { data: state.config }); }
    else { await sSet('config', JSON.stringify(state.config)); }
    document.getElementById('c-pw').value = '';
    toast('管理者密碼已更新', 'ok');
  });
}
